services:
  postgres:
    image: postgres:16-alpine
    container_name: writespace
    platform: linux/amd64
    environment:
      POSTGRES_DB: writespace
      POSTGRES_USER: writespace_user
      POSTGRES_PASSWORD: writespace_password
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5431:5432"
    volumes:
      - postgres_simple_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writespace_user -d writespace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_simple_data:
    driver: local